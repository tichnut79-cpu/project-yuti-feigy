services:
  server:
    build:
      context: ./server/ApiPharm
      dockerfile: Dockerfile
      args:
        DB_PASSWORD: ${DB_PASSWORD}
        DB_USER: ${DB_USER}
        DB_NAME: ${DB_NAME}
    env_file:
      - ./server/ApiPharm/.env
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client/my-react-app
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    env_file:
      - ./client/my-react-app/.env
    ports:
      - "80:80"
    depends_on:
      - server